name: Build macOS VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal Apple Silicon + Intel)"
        run: >
          cmake -S MultiRubyVST3 -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign (ad-hoc) and zip
        run: |
          mkdir out
          find build -type d -name "*.vst3" -prune -exec cp -R {} out/ \;
          codesign --force --deep --sign - out/*.vst3
          ls -la out
          cd out && for p in *.vst3; do ditto -c -k --keepParent "$p" "${p%.vst3}-macOS.zip"; done

      - uses: actions/upload-artifact@v4
        with:
          name: MultiRuby-macOS
          path:
